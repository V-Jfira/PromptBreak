<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Prompt Break</title>
  <desc id="desc">Write one sentence and get a complete six-part master prompt: Role, Task, Context, Reasoning, Stop conditions, and Output. Works inside Claude, ChatGPT, and Copilot.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
      .h { font-size: 56px; font-weight: 800; fill: #0F172A; letter-spacing: -1.5px; }
      .eyebrow { font-size: 13px; font-weight: 700; fill: #556070; letter-spacing: 1.2px; }
      .in { font-size: 21px; fill: #0F172A; }
      .name { font-size: 15px; font-weight: 800; letter-spacing: 0.6px; }
      .sub { font-size: 15px; font-weight: 500; fill: #556070; }
      .body { font-size: 15px; fill: #334155; }
      .tag { font-size: 12px; font-weight: 700; }
      .num { font-size: 15px; font-weight: 800; fill: #FFFFFF; }
      .chip { font-size: 15px; font-weight: 700; fill: #0F172A; }
    </style>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="#EEF2F7"/>

  <!-- brand -->
  <g transform="translate(56 48)">
    <rect x="0" y="0" width="30" height="30" rx="8" fill="#0F172A"/>
    <rect x="6" y="6" width="8" height="8" rx="2" fill="#0369A1"/>
    <rect x="16" y="6" width="8" height="8" rx="2" fill="#4338CA"/>
    <rect x="6" y="16" width="8" height="8" rx="2" fill="#15803D"/>
    <rect x="16" y="16" width="8" height="8" rx="2" fill="#BE185D"/>
    <text x="42" y="22" style="font-size:21px;font-weight:800" fill="#0F172A">Prompt Break</text>
  </g>

  <!-- headline -->
  <text x="56" y="160" class="h">Write <tspan fill="#4338CA">one sentence.</tspan></text>
  <text x="56" y="224" class="h">Get a complete</text>
  <text x="56" y="288" class="h">master prompt.</text>

  <!-- input -->
  <g filter="url(#shadow)">
    <rect x="56" y="330" width="500" height="118" rx="18" fill="#FFFFFF"/>
  </g>
  <text x="80" y="364" class="eyebrow">YOUR PROMPT</text>
  <text x="80" y="398" class="in">Make a 30-day promotion plan</text>
  <text x="80" y="428" class="in">for my new coffee shop</text>

  <!-- arrow -->
  <path d="M572 389 H628" stroke="#4338CA" stroke-width="4" stroke-linecap="round"/>
  <path d="M616 377 L630 389 L616 401" fill="none" stroke="#4338CA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- works inside -->
  <text x="56" y="508" class="eyebrow">WORKS INSIDE</text>
  <g transform="translate(56 524)">
    <rect width="104" height="40" rx="20" fill="#FFFFFF" stroke="#DAE0EA" stroke-width="1.5"/>
    <text x="52" y="26" text-anchor="middle" class="chip">Claude</text>
    <rect x="116" width="118" height="40" rx="20" fill="#FFFFFF" stroke="#DAE0EA" stroke-width="1.5"/>
    <text x="175" y="26" text-anchor="middle" class="chip">ChatGPT</text>
    <rect x="246" width="112" height="40" rx="20" fill="#FFFFFF" stroke="#DAE0EA" stroke-width="1.5"/>
    <text x="302" y="26" text-anchor="middle" class="chip">Copilot</text>
    <rect x="370" width="130" height="40" rx="20" fill="#0F172A"/>
    <text x="435" y="26" text-anchor="middle" class="chip" fill="#FFFFFF" style="fill:#FFFFFF">No API key</text>
  </g>

  <!-- six parts -->
  <g filter="url(#shadow)">
    <rect x="652" y="48" width="572" height="84" rx="16" fill="#FFFFFF"/>
    <rect x="652" y="144" width="572" height="84" rx="16" fill="#FFFFFF"/>
    <rect x="652" y="240" width="572" height="84" rx="16" fill="#FFFFFF"/>
    <rect x="652" y="336" width="572" height="84" rx="16" fill="#FFFFFF"/>
    <rect x="652" y="432" width="572" height="84" rx="16" fill="#FFFFFF"/>
    <rect x="652" y="528" width="572" height="84" rx="16" fill="#FFFFFF"/>
  </g>

  <g transform="translate(652 48)">
    <rect x="16" y="20" width="44" height="44" rx="10" fill="#0369A1"/>
    <text x="38" y="48" text-anchor="middle" class="num">01</text>
    <text x="76" y="36" class="name" fill="#075985">ROLE <tspan class="sub">· role</tspan></text>
    <text x="556" y="36" text-anchor="end" class="tag" fill="#075985">assumed</text>
    <text x="76" y="62" class="body">Act as a senior digital marketer for small coffee shops.</text>
  </g>
  <g transform="translate(652 144)">
    <rect x="16" y="20" width="44" height="44" rx="10" fill="#4338CA"/>
    <text x="38" y="48" text-anchor="middle" class="num">02</text>
    <text x="76" y="36" class="name" fill="#3730A3">TASK <tspan class="sub">· task</tspan></text>
    <text x="556" y="36" text-anchor="end" class="tag" fill="#3730A3">from your input</text>
    <text x="76" y="62" class="body">Build a 30-day plan and end with a ready-to-run summary.</text>
  </g>
  <g transform="translate(652 240)">
    <rect x="16" y="20" width="44" height="44" rx="10" fill="#15803D"/>
    <text x="38" y="48" text-anchor="middle" class="num">03</text>
    <text x="76" y="36" class="name" fill="#166534">CONTEXT <tspan class="sub">· context</tspan></text>
    <text x="556" y="36" text-anchor="end" class="tag" fill="#166534">assumed</text>
    <text x="76" y="62" class="body">Period: 30 days · City: [ISI] · Budget: [ISI]</text>
  </g>
  <g transform="translate(652 336)">
    <rect x="16" y="20" width="44" height="44" rx="10" fill="#A16207"/>
    <text x="38" y="48" text-anchor="middle" class="num">04</text>
    <text x="76" y="36" class="name" fill="#713F12">REASONING <tspan class="sub">· reasoning</tspan></text>
    <text x="556" y="36" text-anchor="end" class="tag" fill="#713F12">assumed</text>
    <text x="76" y="62" class="body">Win first-time guests, then turn them into regulars.</text>
  </g>
  <g transform="translate(652 432)">
    <rect x="16" y="20" width="44" height="44" rx="10" fill="#475569"/>
    <text x="38" y="48" text-anchor="middle" class="num">05</text>
    <text x="76" y="36" class="name" fill="#334155">STOP CONDITIONS <tspan class="sub">· when to stop</tspan></text>
    <text x="556" y="36" text-anchor="end" class="tag" fill="#334155">assumed</text>
    <text x="76" y="62" class="body">Done only when all 30 days have a measurable target.</text>
  </g>
  <g transform="translate(652 528)">
    <rect x="16" y="20" width="44" height="44" rx="10" fill="#BE185D"/>
    <text x="38" y="48" text-anchor="middle" class="num">06</text>
    <text x="76" y="36" class="name" fill="#9D174D">OUTPUT <tspan class="sub">· output format</tspan></text>
    <text x="556" y="36" text-anchor="end" class="tag" fill="#9D174D">needs input</text>
    <text x="76" y="62" class="body">Weekly table: Day · Action · Channel · Target · Cost</text>
  </g>
</svg>
